# GateSphere — LOCAL development stack only.
# Staging uses Vercel / Render / Supabase / Upstash (see docs/platform/deployment-staging.md);
# nothing in this file is used for staging.
name: gatesphere

x-backend-env: &backend-env
  ENVIRONMENT: local
  DEBUG: "true"
  SECRET_KEY: "${SECRET_KEY:-local-dev-secret-please-change-0000000000}"
  FRONTEND_ORIGIN: "http://localhost:3000"
  COOKIE_SECURE: "false"
  DATABASE_URL: "postgresql+psycopg://gatesphere:gatesphere@db:5432/gatesphere"
  POSTGRES_HOST: db
  REDIS_URL: "redis://redis:6379/0"
  REDIS_HOST: redis
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"
  S3_ENDPOINT_URL: "http://minio:9000"
  S3_PUBLIC_URL: "http://localhost:9000"
  S3_ACCESS_KEY: gatesphere
  S3_SECRET_KEY: gatesphere-secret
  S3_BUCKET: gatesphere-local
  EMAIL_BACKEND: "${EMAIL_BACKEND:-console}"
  BREVO_API_KEY: "${BREVO_API_KEY:-}"
  EMAIL_FROM: "${EMAIL_FROM:-no-reply@gatesphere.com}"
  SEED_ON_START: "${SEED_ON_START:-true}"
  RATE_LIMIT_LOGIN: "${RATE_LIMIT_LOGIN:-5/minute}"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gatesphere
      POSTGRES_PASSWORD: gatesphere
      POSTGRES_DB: gatesphere
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatesphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gatesphere
      MINIO_ROOT_PASSWORD: gatesphere-secret
    ports: ["${MINIO_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 gatesphere gatesphere-secret &&
      mc mb -p local/gatesphere-local &&
      mc anonymous set download local/gatesphere-local || true"

  backend:
    build: ./backend
    command: ["api"]
    environment: *backend-env
    volumes: ["./backend:/app"]
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    build: ./backend
    command: ["worker"]
    environment: *backend-env
    volumes: ["./backend:/app"]
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_healthy }

  beat:
    build: ./backend
    command: ["beat"]
    environment: *backend-env
    volumes: ["./backend:/app"]
    depends_on:
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: "http://backend:8000"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on:
      backend: { condition: service_started }

  # Optional: local inbox to view rendered emails. `docker compose --profile tools up mailpit`
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["tools"]
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:
  miniodata:
