name: CI

# Lint & format checks only for now. No tests, migrations, build, or SAST yet
# (see AGENTS.md §12 for the full target pipeline).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.6 black==24.10.0
      - run: ruff check .
      - run: black --check .

  backend-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Ratchet: fails only if the mypy error count grew vs backend/.mypy-baseline (TYP-1).
      - run: bash scripts/mypy-ratchet.sh

  backend-layering:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Ratchet: fails only if the service-layer raw-query count grew vs
      # backend/.repo-layering-baseline (C-3). New queries belong in repository.py.
      - run: bash scripts/repo-layering-ratchet.sh

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npx prettier --check .

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gatesphere
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: gatesphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://gatesphere:secretpassword@localhost:5432/gatesphere_test
      - name: Run tests
        run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://gatesphere:secretpassword@localhost:5432/gatesphere_test
          REDIS_URL: redis://localhost:6379/0

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend
        run: docker build -t gatesphere-backend ./backend
      - name: Build Frontend
        run: docker build -t gatesphere-frontend ./frontend
