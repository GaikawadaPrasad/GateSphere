name: CI

# Lint/format/types + backend & frontend test suites (real Postgres/Redis/MinIO for
# backend) + dependency and secret scanning. See AGENTS.md §12 for the target pipeline;
# CR-02/HP-05/M-03/M-04 (backend/REMEDIATION_LOG.md) closed the remaining gap between
# this file and that target — build/migrations were already reproducible, tests just
# weren't wired in here and there was no scanning.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.6 black==24.10.0
      - run: ruff check .
      - run: black --check .

  backend-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock.txt
      # Ratchet: fails only if the mypy error count grew vs backend/.mypy-baseline (TYP-1).
      - run: bash scripts/mypy-ratchet.sh

  backend-layering:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Ratchet: fails only if the service-layer raw-query count grew vs
      # backend/.repo-layering-baseline (C-3). New queries belong in repository.py.
      - run: bash scripts/repo-layering-ratchet.sh

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gatesphere
          POSTGRES_PASSWORD: gatesphere
          POSTGRES_DB: gatesphere
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gatesphere"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: bitnami/minio:2024
        env:
          MINIO_ROOT_USER: gatesphere
          MINIO_ROOT_PASSWORD: gatesphere-secret
          MINIO_DEFAULT_BUCKETS: gatesphere-local
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: local
      DEBUG: "true"
      SECRET_KEY: ci-test-secret-key-not-for-production-0000
      DATABASE_URL: postgresql+psycopg://gatesphere:gatesphere@localhost:5432/gatesphere
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_ACCESS_KEY: gatesphere
      S3_SECRET_KEY: gatesphere-secret
      S3_BUCKET: gatesphere-local
      S3_REGION: us-east-1
      EMAIL_BACKEND: console
      SEED_ON_START: "false"
      RATE_LIMIT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock.txt
      - run: alembic upgrade head
      - run: python -m app.scripts.seed --reset
      - run: pytest -q

  backend-dependency-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.7.3
      # Scans the fully-pinned transitive lockfile, not the loose top-level requirements.txt.
      - run: pip-audit --require-hashes -r requirements.lock.txt

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `ci`, not `install` (CR-02/M-04): fails if package.json and package-lock.json
      # disagree, and never writes to the lockfile — package-lock.json is enforced, not
      # just present.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check .

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  frontend-dependency-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # High/critical only — the frontend has the usual long tail of low/moderate
      # transitive advisories with no fix available; those are triaged manually, not
      # blocking every PR. Ratchet this down over time rather than all at once.
      - run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
